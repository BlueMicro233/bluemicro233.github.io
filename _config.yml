# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: BrownieCake's
subtitle: 博客
description: 布朗尼蛋糕的个人博客，记录学习笔记、技术折腾与一些胡思乱想。
keywords: 博客,技术,数学,计算机,哲学,随笔
author: 布朗尼蛋糕
language: zh-Hans
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://bluemicro233.github.io
root: /
permalink: post/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '    '
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
theme: lyc

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '

# Archive generator
archive_generator:
  enabled: true
  per_page: 30
  yearly: true
  monthly: false
  daily: false
  order_by: -date

# Category generator
category_generator:
  per_page: 20
  order_by: -date

# Tag generator
tag_generator:
  per_page: 20
  enable_index_page: false
  order_by: -date

# Markdown renderer
marked:
  gfm: true
  pedantic: false
  breaks: false
  smartLists: true
  smartypants: false
  modifyAnchors: 0
  autolink: true
  sanitizeUrl: false
  headerIds: true
  lazyload: false
  prependRoot: false

# Deployment
deploy:
  type: ''
